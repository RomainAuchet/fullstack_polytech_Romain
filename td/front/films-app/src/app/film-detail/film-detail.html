@if (erreur()) {
  <p>{{ erreur() }}</p>
}

@if (film(); as f) {
  <h2>{{ f.titre }} ({{ f.realisateur }})</h2>
  <a [routerLink]="['/films', f.id, 'modifier']">Modifier le film</a>
  
  <h3>Acteurs associés</h3>
  <ul>
    @for (a of f.acteurs; track a.id) {
      <li>
        <a [routerLink]="['/acteurs', a.id]">{{ a.nom }} {{ a.prenom }}</a>
        <button (click)="dissocier(a.id)">Retirer</button>
      </li>
    } @empty {
      <p>Aucun acteur associé.</p>
    }
  </ul>

  <h3>Associer un nouvel acteur</h3>
  <select [(ngModel)]="acteurSelection">
    <option [ngValue]="null">Choisir un acteur...</option>
    @for (a of acteursDisponibles(); track a.id) {
      <option [ngValue]="a.id">{{ a.nom }} {{ a.prenom }}</option>
    }
  </select>
  <button (click)="associer()" [disabled]="!acteurSelection()">Associer</button>
}
